<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apê Compras</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
      min-height: 100vh;
    }

    header {
      height: 70px;
      background: #202020;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #b87513;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 15px;
      cursor: pointer;
      padding: 10px;
    }

    nav button:hover,
    nav button.active {
      color: #d88916;
    }

    main {
      max-width: 1100px;
      margin: 45px auto;
      padding: 0 25px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #aaa;
      font-size: 17px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card {
      background: #242424;
      border: 1px solid #303030;
      border-radius: 14px;
      padding: 25px;
      min-height: 150px;
    }

    .card h2 {
      font-size: 17px;
      color: #aaa;
      margin-bottom: 15px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .description {
      color: #aaa;
    }

    .main-card {
      border-left: 4px solid #d88916;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      background: #c27b13;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 20px;
      }

      nav {
        gap: 5px;
      }

      nav button {
        font-size: 12px;
      }

      main {
        margin-top: 30px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🛒</div>
      <span>Apê Compras</span>
    </div>

    <nav>
      <button class="active">Início</button>
      <button>Estoque</button>
      <button>Lista</button>
      <button>Carrinho</button>
      <button>Histórico</button>
    </nav>
  </header>

  <main>

    <section class="welcome">
      <h1>Olá, Juan e Mariana 👋</h1>
      <p>O que vamos fazer hoje?</p>
    </section>

    <section class="cards">

      <div class="card main-card">
        <h2>📦 ESTOQUE</h2>
        <div class="number">101</div>
        <div class="description">produtos cadastrados</div>
        <button class="button">Conferir estoque →</button>
      </div>

      <div class="card">
        <h2>🛒 LISTA DE COMPRAS</h2>
        <div class="number">0</div>
        <div class="description">produtos para comprar</div>
        <button class="button">Ver lista →</button>
      </div>

      <div class="card">
        <h2>💰 GASTO DO MÊS</h2>
        <div class="number">R$ 0,00</div>
        <div class="description">compras realizadas este mês</div>
      </div>

      <div class="card">
        <h2>🧾 ÚLTIMA COMPRA</h2>
        <div class="number">—</div>
        <div class="description">Nenhuma compra registrada ainda</div>
      </div>

    </section>

  </main>

</body>
</html>
